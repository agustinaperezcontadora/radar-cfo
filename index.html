<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Radar CFO · Diagnóstico financiero para negocios de servicios</title>
<meta name="description" content="Diagnóstico financiero gratuito para negocios de servicios. Descubrí en qué situación está tu negocio y por dónde empezar. Por Agustina Pérez.">
<meta name="theme-color" content="#EDF2F3">
<meta property="og:title" content="Radar CFO: ¿tu negocio te da plata o solo te da trabajo?">
<meta property="og:description" content="Diagnóstico financiero para negocios de servicios. Sin planillas, en 8 minutos.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#1B6070;--azul-dark:#0F3F4B;--azul-soft:#DCEBEE;
  --marron:#8B6058;--marron-dark:#6E4A43;--marron-soft:#F1E6E2;
  --bg:#EDF2F3;--paper:#FFFFFF;--ink:#102A30;--muted:#54686D;--line:#D3DEE0;
  --bajo:#A5483C;--medio:#9C6A1E;--alto:#2E7A5C;
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --body:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --gut:16px;
}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px;overflow-x:hidden}
button{font-family:inherit;font-size:inherit}
:focus-visible{outline:3px solid var(--marron);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- HEADER ---------- */
.head{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.head-in{max-width:720px;margin:0 auto;padding:10px var(--gut) 9px}
.brand-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:17px;color:var(--azul-dark);letter-spacing:-.01em;white-space:nowrap}
.by{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.35}
.by a{color:var(--azul);text-decoration:none;font-weight:600}
body.in-q .by{display:none}
@media(max-width:479px){.by .role{display:none}}
.bars{display:grid;gap:4px;margin-top:9px}
.bar{height:6px;border-radius:3px;background:#C9D7DA;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--azul);transition:width .3s ease}
.bar.done i{background:var(--marron)}
.bar-meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin-top:6px}
.bar-meta b{color:var(--azul-dark);font-weight:600}
.bar-meta span:last-child{flex:0 0 auto}

/* ---------- LAYOUT ---------- */
main{max-width:720px;margin:0 auto;padding:16px var(--gut) 40px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 18px}
@media(min-width:620px){:root{--gut:22px}main{padding:26px var(--gut) 60px}.card{padding:30px;border-radius:18px}}

/* ---------- BOTONES ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:12px;border:0;background:var(--azul);color:#fff;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s;text-align:center}
.btn:hover{background:var(--azul-dark)}
.btn:disabled{background:#9DB5BA;cursor:not-allowed}
.btn.ghost{background:var(--paper);color:var(--azul-dark);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--azul-soft)}
.btn.marron{background:var(--marron)}.btn.marron:hover{background:var(--marron-dark)}
.btn.full{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.link-btn{background:none;border:0;color:var(--muted);font-size:14.5px;cursor:pointer;padding:10px 2px;text-decoration:underline;text-underline-offset:3px}

/* ---------- INTRO ---------- */
.intro h1{font-family:var(--display);font-weight:800;font-size:clamp(31px,7.6vw,50px);line-height:1.04;letter-spacing:-.025em;color:var(--azul-dark);max-width:15ch}
.intro .lead{font-size:16.5px;color:var(--ink);margin-top:14px;max-width:54ch}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.chip{font-size:13px;font-weight:600;color:var(--azul-dark);background:var(--azul-soft);border-radius:20px;padding:6px 12px}
.intro .btn{margin-top:18px}
.firma{display:flex;align-items:center;gap:13px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.firma img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:0 0 52px}
.firma-n{font-weight:700;font-size:15px}
.firma-b{font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.intro-list{list-style:none;margin:18px 0 0;border-top:1px solid var(--line)}
.intro-list li{display:grid;grid-template-columns:1fr;gap:2px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.intro-list li span:first-child{font-family:var(--display);font-weight:700;color:var(--marron)}
@media(min-width:620px){.intro-list li{grid-template-columns:140px 1fr;gap:16px}}
.quote{margin-top:18px;padding:16px 18px;background:var(--marron-soft);border-radius:12px;color:var(--marron-dark);font-size:14.5px}

/* ---------- PREGUNTA ---------- */
.q-count{font-size:13px;color:var(--muted)}
.q-title{font-family:var(--display);font-weight:700;font-size:clamp(22px,5.4vw,29px);line-height:1.2;letter-spacing:-.015em;color:var(--azul-dark);margin:6px 0 6px;max-width:30ch}
.q-hint{font-size:14.5px;color:var(--muted);max-width:58ch}
.opts{display:grid;gap:9px;margin-top:18px}
.opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:14px 15px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;font-size:16px;line-height:1.35;color:var(--ink);cursor:pointer;transition:border-color .12s,background .12s;min-height:56px}
@media(hover:hover){.opt:hover{border-color:var(--azul);background:#F6FAFB}}
.opt .k{flex:0 0 26px;height:26px;border-radius:7px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:var(--muted)}
.opt.sel{border-color:var(--azul);background:var(--azul-soft);box-shadow:inset 0 0 0 1px var(--azul)}
.opt.sel .k{background:var(--azul);border-color:var(--azul);color:#fff}
.opt.sel .k::after{content:'✓'}
.opt.sel .k .n{display:none}
.multi-note{font-size:13px;color:var(--marron);margin-top:11px;font-weight:600}
.kbd-hint{display:none;font-size:12.5px;color:var(--muted);margin-top:14px}
@media(hover:hover) and (pointer:fine){.kbd-hint{display:block}}
textarea,input,select{font-family:inherit;font-size:16px;color:var(--ink)}
textarea{width:100%;min-height:120px;margin-top:16px;padding:13px;border:1.5px solid var(--line);border-radius:12px;resize:vertical;line-height:1.5}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px var(--azul-soft)}

/* nav: se fija al pulgar solo cuando hay una acción principal que alcanzar */
.q-nav{display:flex;gap:10px;align-items:stretch;margin-top:14px}
.q-nav .btn{flex:1}
.q-nav .btn.back{flex:0 0 auto;min-width:104px}
.q-nav.pinned{position:sticky;bottom:0;z-index:20;
  padding:14px 0 calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 76%,rgba(237,242,243,0))}
@media(min-width:620px){
  .q-nav{margin-top:22px;justify-content:space-between}
  .q-nav.pinned{position:static;background:none;padding:0}
  .q-nav .btn{flex:0 0 auto}
}

/* ---------- RESPIRO ---------- */
.breaker{text-align:left}
.breaker .eyebrow{font-size:13px;color:var(--marron);font-weight:700}
.breaker h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,6.4vw,38px);line-height:1.1;letter-spacing:-.02em;color:var(--azul-dark);margin:8px 0 12px;max-width:18ch}
.breaker p{font-size:16px;max-width:50ch}
.donut{display:flex;align-items:center;gap:14px;margin:18px 0 4px;padding:14px 16px;background:var(--azul-soft);border-radius:12px}
.donut b{font-family:var(--display);font-size:26px;color:var(--azul-dark);line-height:1}
.donut span{font-size:14px;color:var(--azul-dark)}

/* ---------- CALCULANDO ---------- */
.calc{text-align:center;padding:44px 18px}
.calc h2{font-family:var(--display);font-weight:800;font-size:clamp(24px,6vw,34px);color:var(--azul-dark);line-height:1.1;letter-spacing:-.02em}
.calc-list{list-style:none;margin:22px auto 0;max-width:300px;text-align:left;display:grid;gap:9px}
.calc-list li{font-size:15px;color:var(--muted);opacity:.32;transition:opacity .25s,color .25s;display:flex;gap:9px;align-items:center}
.calc-list li.on{opacity:1;color:var(--azul-dark);font-weight:600}
.calc-list li::before{content:'';width:9px;height:9px;border-radius:50%;background:currentColor;flex:0 0 9px}

/* ---------- RESULTADO ---------- */
.r-kicker{font-size:14px;color:var(--muted)}
.r-perfil{font-family:var(--display);font-weight:800;font-size:clamp(32px,8.4vw,56px);line-height:1.02;letter-spacing:-.03em;color:var(--azul-dark);margin:6px 0 14px}
.r-frase{font-size:17px;line-height:1.5;max-width:52ch}
.score{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.score-top{display:flex;align-items:baseline;gap:12px}
.score-num{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.score-num small{font-size:15px;color:var(--muted);font-weight:500}
.score-track{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.score-track i{display:block;height:100%;border-radius:5px;transition:width .6s ease}
.score-frame{font-size:14.5px;color:var(--muted);margin-top:10px;max-width:50ch}

.report{display:grid;gap:14px;margin-top:14px}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 18px}
@media(min-width:620px){.sec{padding:28px;border-radius:18px}.report{gap:18px;margin-top:18px}}
.sec h3{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.01em;color:var(--azul-dark);margin-bottom:4px}
@media(min-width:620px){.sec h3{font-size:24px}}
.sec .sub{color:var(--muted);font-size:14.5px;margin-bottom:16px}

.area-chart{display:grid;gap:13px}
.ac-row{display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center}
.ac-name{font-size:15px;font-weight:600}
.ac-val{text-align:right;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.ac-track{grid-column:1/-1;height:10px;background:var(--bg);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.ac-track i{display:block;height:100%;border-radius:5px}
@media(min-width:620px){
  .ac-row{grid-template-columns:186px 1fr 46px}
  .ac-name{order:1}.ac-track{order:2;grid-column:auto}.ac-val{order:3}
}
.lv-bajo{background:var(--bajo)}.lv-medio{background:var(--medio)}.lv-alto{background:var(--alto)}
.tx-bajo{color:var(--bajo)}.tx-medio{color:var(--medio)}.tx-alto{color:var(--alto)}
.sample-note{font-size:13.5px;color:var(--marron);font-weight:600;margin-top:14px}

.prio{border-top:1px solid var(--line)}
.prio-item{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.prio-n{font-family:var(--display);font-weight:800;font-size:24px;color:var(--marron);line-height:1.1}
.prio-item h4{font-size:16.5px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;color:#fff}
.prio-item p{margin-top:5px;font-size:15px}
.prio-item .accion{margin-top:9px;font-size:15px;color:var(--azul-dark);background:var(--azul-soft);padding:11px 13px;border-radius:10px}

.others{display:grid}
.other{font-size:15px;padding:12px 0;border-bottom:1px solid var(--line)}
.other:last-child{border-bottom:0}
.other b{display:block;font-weight:700;margin-bottom:2px}

.historia{background:var(--marron-soft);border-color:#E3D2CC}
.historia h3{color:var(--marron-dark)}
.historia p{font-size:15.5px;margin-top:8px}

/* ---------- SERVICIOS ---------- */
.servs{display:grid;gap:12px}
.serv{border:1.5px solid var(--line);border-radius:14px;padding:18px 16px;background:#fff}
.serv.top{background:var(--azul-dark);border-color:var(--azul-dark);color:#fff;padding:22px 18px}
@media(min-width:620px){.serv{padding:22px;border-radius:16px}.serv.top{padding:26px}}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--azul-soft);color:var(--azul-dark);line-height:1.3}
.tag.rec{background:var(--marron);color:#fff}
.serv.top .tag{background:rgba(255,255,255,.16);color:#fff}
.serv.top .tag.rec{background:#fff;color:var(--marron-dark)}
.serv h4{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.15}
.serv p{margin-top:6px;font-size:15px}
.serv.top p{color:rgba(255,255,255,.88)}
.serv p.alc{margin-top:4px;font-size:13.5px;font-weight:600;color:var(--marron)}
.serv.top p.alc{color:#EAD2CB}
.serv .porque{margin-top:12px;font-size:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22)}
.serv .btn{margin-top:15px;width:100%}
.serv.top .btn{background:#fff;color:var(--azul-dark)}
.serv.top .btn:hover{background:var(--marron-soft)}

/* ---------- MURO ---------- */
.veil{position:relative;overflow:hidden;border-radius:16px}
.veil>*{filter:blur(6px);pointer-events:none;user-select:none}
.veil.short{max-height:126px}
.veil.tall{max-height:300px;-webkit-mask-image:linear-gradient(#000 45%,transparent);mask-image:linear-gradient(#000 45%,transparent)}
.veil::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(237,242,243,0) 30%,rgba(237,242,243,.55))}

.gate{background:var(--paper);border:2px solid var(--marron);border-radius:16px;padding:18px 16px;box-shadow:0 12px 34px rgba(15,63,75,.13)}
@media(min-width:620px){.gate{padding:28px}}
.gate h2{font-family:var(--display);font-weight:800;font-size:clamp(21px,5.4vw,29px);line-height:1.12;color:var(--azul-dark);letter-spacing:-.02em}
.gate .gsub{font-size:14.5px;color:var(--muted);margin-top:6px}
.gate-list{font-size:13.5px;margin-top:10px;color:var(--ink);line-height:1.5;background:var(--azul-soft);border-radius:10px;padding:10px 12px}
.gate-list b{color:var(--alto);font-weight:800}
.form{display:grid;gap:10px;margin-top:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.phone{display:grid;grid-template-columns:104px 1fr;gap:8px}
.phone select{font-size:15px;padding:0 4px 0 9px}
.fld label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.fld input,.fld select{width:100%;height:48px;padding:0 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.fld.err input,.fld.err select{border-color:var(--bajo);background:#FDF6F5}
.fld .fe{font-size:12.5px;color:var(--bajo);margin-top:4px;display:none}
.fld.err .fe{display:block}
details.extra{border-top:1px solid var(--line);padding-top:10px}
details.extra summary{font-size:14px;color:var(--azul);font-weight:600;cursor:pointer;padding:4px 0;list-style:none}
details.extra summary::-webkit-details-marker{display:none}
details.extra summary::before{content:'+ ';font-weight:700}
details.extra[open] summary::before{content:'– '}
details.extra .row2{margin-top:11px}
.consent{display:flex;gap:11px;align-items:flex-start;font-size:13px;color:var(--muted);line-height:1.45;cursor:pointer}
.consent input{margin-top:2px;width:22px;height:22px;accent-color:var(--azul);flex:0 0 22px}
.form-err{color:var(--bajo);font-size:14px;font-weight:600;min-height:1px}
.gate-foot{font-size:12px;color:var(--muted);margin-top:9px;text-align:center}

/* ---------- CIERRE ---------- */
.sent{font-size:14px;color:var(--alto);margin-top:14px;font-weight:600}
.keep{background:var(--azul-soft);border:1px solid #BFD8DD;border-radius:14px;padding:18px 16px;display:grid;gap:11px}
.keep h4{font-family:var(--display);font-size:18px;color:var(--azul-dark);font-weight:700}
.keep p{font-size:14.5px;color:var(--azul-dark)}
.keep-url{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--muted);font-family:ui-monospace,monospace;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.social{display:flex;align-items:center;gap:13px;background:var(--marron-soft);border:1px solid #E3D2CC;border-radius:14px;padding:17px 16px;text-decoration:none;color:var(--marron-dark)}
.social b{display:block;font-size:16px;font-family:var(--display)}
.social span{font-size:14px}
footer{max-width:720px;margin:0 auto;padding:0 var(--gut) 44px;font-size:12.5px;color:var(--muted);line-height:1.5}
footer a{color:var(--azul);font-weight:600;text-decoration:none}
</style>
</head>

<header class="head">
  <div class="head-in">
    <div class="brand-row">
      <div class="brand">Radar CFO</div>
      <div class="by"><span class="role">Agustina Pérez, estratega financiera<br></span><a href="https://www.instagram.com/agustinaperez.estratega/" target="_blank" rel="noopener">@agustinaperez.estratega</a></div>

    <div class="bar-meta" id="barMeta"></div>

<main id="app"></main>
<div class="sr" role="status" aria-live="polite" id="live"></div>

<footer>Radar CFO es una guía orientativa. Tu negocio tiene matices que solo vos conocés: por eso las reglas financieras las definís vos. Hecho por <a href="https://www.instagram.com/agustinaperez.estratega/" target="_blank" rel="noopener">@agustinaperez.estratega</a></footer>

<script>
/* =====================================================================
   CONFIGURACIÓN — lo único que tenés que tocar
   ===================================================================== */
const CONFIG = {
  // URL del disparador "Webhook entrante" de tu workflow en GoHighLevel
  GHL_WEBHOOK_URL: 'https://services.leadconnectorhq.com/hooks/gRITT5NbABZh0l1iIqw4/webhook-trigger/465f0bc3-5df6-44b3-af9e-3b7aea6ddab9',
  // URL pública donde queda publicado (GitHub Pages). Se usa para el link del informe.
  PUBLIC_URL: '',
  // Tu foto para el intro. Dejalo vacío y no se muestra ninguna imagen.
  FOTO_URL: '',
  // Línea de credibilidad del intro. Si tenés un número real de clientas, ponelo acá.
  BIO: 'Contadora y estratega financiera. Acompaño negocios de servicios a ordenar sus números y decidir con criterio propio.',
  INSTAGRAM: 'https://www.instagram.com/agustinaperez.estratega/',
  LINKS: {
    academia:  'https://academia-finanzassolidas.com',
    asesorias: 'https://agustinaperezcontadora.com.uy/asesorias',
    libro:     'https://agustinaperezcontadora.com.uy'
  },
  STORAGE_KEY: 'radarcfo_v2'
};

/* =====================================================================
   ÁREAS Y PREGUNTAS
   ===================================================================== */
const AREAS = [
  {id:'claridad',  name:'Claridad financiera'},
  {id:'precios',   name:'Precios y rentabilidad'},
  {id:'caja',      name:'Caja y previsión'},
  {id:'orden',     name:'Orden y registros'},
  {id:'sueldo',    name:'Tu sueldo'},
  {id:'modelo',    name:'Modelo y clientes'},
  {id:'direccion', name:'Tiempo y decisiones'},
  {id:'historia',  name:'Tu historia'},
  {id:'camino',    name:'Por dónde seguir'}
];
const SCORED_AREAS = AREAS.slice(0,7);

const Q = [

  base:{nombre:'Tu Base Financiera',desc:'Acompañamiento 1:1 para salir del caos y dejar tus finanzas ordenadas, claras y bajo control, con el kit completo de plantillas y tu Cerebro Financiero lite.',formatos:['uno'],alcance:'45 días de acompañamiento 1:1',alcanceMatch:['45d'],link:'asesorias',cta:'Conocer el programa'},
  cfo:{nombre:'CFO de tu marca',desc:'Mentoría 1:1 para convertirte en quien toma las decisiones financieras de tu negocio: método, planificación financiera anual y acceso para una persona de tu equipo.',formatos:['uno'],alcance:'3 meses de mentoría 1:1',alcanceMatch:['3m'],link:'asesorias',cta:'Conocer el programa'},
  cfo1dia:{nombre:'CFO en un día',desc:'Una jornada 1:1 para salir con tu sistema financiero armado y andando: planificación anual, dashboard y tu Cerebro Financiero a medida.',formatos:['uno'],alcance:'1 jornada intensiva 1:1 + seguimiento',alcanceMatch:['dia'],link:'asesorias',cta:'Conocer la jornada'}
};

/* =====================================================================
   PASOS (preguntas + respiros)
   ===================================================================== */
const STEPS = [];
Q.forEach(q=>{
  const b = BREAKS.find(b=>b.before===q.id);
  if(b) STEPS.push({kind:'break', b});
  STEPS.push({kind:'q', q});
});
const AREA_COUNTS = AREAS.map(a=>Q.filter(q=>q.area===a.id).length);

/* =====================================================================
   ESTADO
   ===================================================================== */
let S = {screen:'intro', i:0, answers:{}, unlocked:false, lead:null, leadDone:false};
let fromShared = false, mailSent = false;

const store = {
  get(){ try{ return JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY)||'null'); }catch(e){ return null; } },
  set(){ if(fromShared) return; try{ localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(S)); }catch(e){} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qById = id => Q.find(q=>q.id===id);
const label = (qid) => {
  const q=qById(qid), v=S.answers[qid];
  if(v==null||v==='') return '';
  if(q.type==='text') return v;
  if(Array.isArray(v)) return v.map(x=>(q.opts.find(o=>o.v===x)||{}).t).filter(Boolean).join('; ');
  return (q.opts.find(o=>o.v===v)||{}).t||'';
};
const answered = q => { const v=S.answers[q.id]; return q.type==='text' ? v!==undefined : Array.isArray(v) ? v.length>0 : v!=null; };
const nAnswered = () => Q.filter(answered).length;
const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =====================================================================
   CÁLCULOS
   ===================================================================== */
function scores(){
  const out={};
  SCORED_AREAS.forEach(a=>{
    let s=0,m=0;
    Q.filter(q=>q.area===a.id&&q.scored).forEach(q=>{
      m+=3; const o=q.opts.find(o=>o.v===S.answers[q.id]); if(o) s+=o.s;
    });
    out[a.id]=m?Math.round(s/m*100):0;
  });
  out.global=Math.round(SCORED_AREAS.reduce((t,a)=>t+out[a.id],0)/SCORED_AREAS.length);
  return out;
}
const nivel = n => n<40?'bajo':n<70?'medio':'alto';
const nivelTxt = {bajo:'Para atender ya',medio:'En construcción',alto:'Sólido'};
const scoreFrame = n => n<40
  ? 'Un número bajo no dice que tu negocio esté mal: dice que hay mucho sobre la mesa para recuperar. Lo que está desordenado se ordena, y es más rápido de lo que parece.'
  : n<70
  ? 'Tenés una base sobre la cual trabajar. La diferencia está en pocas decisiones concretas, no en empezar todo de nuevo.'
  : 'Tu base es sólida. Lo que sigue no es ordenar: es usar esos números para dirigir y planificar el crecimiento.';

function perfil(sc){
  if(sc.global>=72) return 'dirigir';
  if(sc.caja<40 || (sc.claridad+sc.orden)/2<40) return 'supervivencia';
  const plata=(sc.precios+sc.sueldo+sc.modelo)/3, base=(sc.claridad+sc.orden+sc.caja)/3;
  return plata<=base ? 'poco' : 'sindireccion';
}

function recomendar(pf){
  const A=S.answers, p={libro:0,academia:0,diagnostico:0,base:0,cfo:0,cfo1dia:0};
  const add=o=>{ if(o) Object.entries(o).forEach(([k,v])=>p[k]+=v); };
  // Forma de aprender: on demand (academia, libro) vs 1:1 (todas las asesorías)
  add({ondemand:{academia:6,libro:2,diagnostico:-7,base:-7,cfo:-7,cfo1dia:-8},
       combinado:{academia:3,diagnostico:4,libro:1,base:-1,cfo:-2,cfo1dia:-3},
       uno:{diagnostico:2,base:2,cfo:2,cfo1dia:2,academia:-3,libro:-3}}[A.f2]);
  // Alcance: define cuál de las asesorías 1:1 encaja
  add({solo:{academia:5,libro:2},puntual:{diagnostico:6},'45d':{base:6},'3m':{cfo:6},dia:{cfo1dia:7}}[A.f6]);
  add({m100:{libro:4,academia:4,diagnostico:-4,base:-6,cfo:-8,cfo1dia:-10},
       '100_500':{academia:3,diagnostico:4,base:-3,cfo:-5,cfo1dia:-8},
       '500_1500':{base:4,diagnostico:2,academia:1,cfo:-2,cfo1dia:-6},
       '1500_3000':{cfo:4,base:2,diagnostico:1,cfo1dia:-2},
       m3000:{cfo1dia:4,cfo:3}}[A.f5]);
  add({bases:{libro:2,academia:4},ordenar:{base:4,academia:1},decision:{diagnostico:5},dirigir:{cfo:5,cfo1dia:2}}[A.f1]);
  add({ya:{base:1,cfo1dia:2,diagnostico:2},meses:{cfo:1,base:1},explorando:{academia:2,libro:2,cfo1dia:-2}}[A.f3]);
  add({m1:{academia:1,cfo1dia:2,diagnostico:1,cfo:-1},'1_3':{base:1,academia:1},m3:{cfo:2,base:1}}[A.f4]);
  add({supervivencia:{base:2,academia:1},poco:{diagnostico:1,academia:1,base:1},sindireccion:{cfo:2},dirigir:{cfo:2,cfo1dia:2}}[pf]);
  const junior = A.m4==='m1k' || A.d4==='m1';
  if(junior) p.libro+=3; else if(A.f5!=='m100') p.libro-=6;
  if(A.m4==='15_30k'||A.m4==='m30k'){ p.libro-=4; p.academia-=1; p.cfo+=1; p.cfo1dia+=1; }
  return Object.keys(p).sort((a,b)=>p[b]-p[a]).slice(0,3);
}

function tagsFor(id, idx){
  const t=[];
  if(idx===0) t.push({txt:'Recomendado para vos',rec:true});
  if(S.answers.f2 && SERVICIOS[id].formatos.includes(S.answers.f2)) t.push({txt:'Coincide con tu forma de aprender'});
  if(S.answers.f6 && SERVICIOS[id].alcanceMatch.includes(S.answers.f6)) t.push({txt:'Coincide con el acompañamiento que buscás'});
  if(id==='cfo') t.push({txt:'El más elegido'});
  if(id==='academia'||id==='libro') t.push({txt:'Para empezar hoy'});
  if(id==='diagnostico') t.push({txt:'Se descuenta de tu próxima mentoría'});
  return t;
}

function porQue(id, prios){
  const A=S.answers, partes=[];
  const busca={bases:'entender las bases',ordenar:'ordenar tus finanzas',decision:'resolver una decisión puntual',dirigir:'pasar a dirigir con números'}[A.f1];
  const aprende={ondemand:'aprender a tu ritmo',combinado:'combinar contenido con alguna sesión 1:1',uno:'trabajar 1:1 sobre tus números'}[A.f2];
  const alcance={solo:'arrancar por tu cuenta',puntual:'resolver algo puntual','45d':'ordenar todo en unas semanas','3m':'un proceso de varios meses',dia:'resolverlo en un día'}[A.f6];
  if(busca) partes.push('buscás '+busca);
  if(aprende && SERVICIOS[id].formatos.includes(A.f2)) partes.push('preferís '+aprende);
  if(alcance && SERVICIOS[id].alcanceMatch.includes(A.f6)) partes.push('querés '+alcance);
  partes.push('tu área más urgente es '+AREAS.find(a=>a.id===prios[0]).name.toLowerCase());
  return 'Por qué te lo recomiendo: '+partes.join(', ')+'.';
}

function linkServ(id){
  const u=new URL(CONFIG.LINKS[SERVICIOS[id].link]);
  u.searchParams.set('utm_source','radar-cfo'); u.searchParams.set('utm_medium','diagnostico'); u.searchParams.set('utm_content',id);
  return u.toString();
}

function buildResult(){
  const sc=scores(), pf=perfil(sc);
  const prios=SCORED_AREAS.map(a=>a.id).sort((a,b)=>sc[a]-sc[b]).slice(0,3);
  return {sc,pf,prios,recs:recomendar(pf)};
}

/* =====================================================================
   RENDER
   ===================================================================== */
function renderBars(){
  const bars=$('#bars'), meta=$('#barMeta');
  const done = S.screen==='result'||S.screen==='calc';
  bars.style.gridTemplateColumns = AREA_COUNTS.map(n=>n+'fr').join(' ');
  bars.innerHTML = AREAS.map((a,k)=>{
    const qs=Q.filter(q=>q.area===a.id), n=qs.filter(answered).length;
    const full = done || n===qs.length;
    const w = done ? 100 : Math.round(n/qs.length*100);
    return `<div class="bar ${full?'done':''}" title="${esc(a.name)}"><i style="width:${w}%"></i></div>`;
  }).join('');

  if(S.screen==='q'||S.screen==='break'){
    const st=STEPS[S.i];
    const areaId = st.kind==='q' ? st.q.area : qById(st.b.before).area;
    const a=AREAS.find(x=>x.id===areaId);
    meta.innerHTML=`<span><b>${esc(a.name)}</b></span><span>${nAnswered()} de ${Q.length}</span>`;
  } else if(done){
    meta.innerHTML=`<span><b>Diagnóstico completo</b></span><span>${Q.length} de ${Q.length}</span>`;
  } else {
    meta.innerHTML=`<span>7 áreas de tu negocio, con foco financiero</span><span>8 min</span>`;
  }
  document.body.classList.toggle('in-q', S.screen==='q'||S.screen==='break');
}

function render(){
  renderBars();
  const app=$('#app');
  if(S.screen==='intro') app.innerHTML=viewIntro();
  else if(S.screen==='break') app.innerHTML=viewBreak();
  else if(S.screen==='q') app.innerHTML=viewQuestion();
  else if(S.screen==='calc') app.innerHTML=viewCalc();
  else app.innerHTML=viewResult();
  store.set();
}
function say(t){ const l=$('#live'); if(l) l.textContent=t; }

/* ---------- PREGUNTA ---------- */
function viewQuestion(){
  const q=STEPS[S.i].q, v=S.answers[q.id];
  const nq=Q.indexOf(q)+1;
  let body='';
  if(q.type==='text'){
    body=`<textarea id="txt" data-qid="${q.id}" placeholder="Escribí lo que quieras, con tus palabras..." oninput="onText(this)">${esc(v||'')}</textarea>`;
  } else {
    body=`<div class="opts" id="opts" role="${q.type==='multi'?'group':'radiogroup'}" aria-label="${esc(q.q)}">${q.opts.map((o,k)=>{
      const sel = Array.isArray(v) ? v.includes(o.v) : v===o.v;
      return `<button type="button" class="opt ${sel?'sel':''}" role="${q.type==='multi'?'checkbox':'radio'}" aria-checked="${sel}" onclick="pick('${o.v}')"><span class="k"><span class="n">${k+1}</span></span><span>${esc(o.t)}</span></button>`;
    }).join('')}</div>
    ${q.max?`<div class="multi-note">Elegiste ${(v||[]).length} de ${q.max}.</div>`:''}
    ${q.type==='multi'&&!q.max?`<div class="multi-note">Podés marcar varias.</div>`:''}
    <div class="kbd-hint">Atajo: tocá las teclas 1 a ${q.opts.length} para elegir${q.type==='multi'?', y Enter para seguir':''}.</div>`;
  }
  const showNext = q.type!=='single';
  const canNext = q.type==='text' || (v||[]).length>0;
  const nextTxt = q.type==='text' ? ((v||'').trim()?'Continuar':'Saltar esta pregunta') : 'Continuar';
  return `<section class="card">
    <div class="q-count">Pregunta ${nq} de ${Q.length}</div>
    <h1 class="q-title">${esc(q.q)}</h1>
    ${q.hint?`<p class="q-hint">${esc(q.hint)}</p>`:''}
    ${body}
  </section>
  <div class="q-nav ${showNext?'pinned':''}">
    <button class="btn ghost back" onclick="back()">Volver</button>
    ${showNext?`<button class="btn" id="nextBtn" ${canNext?'':'disabled'} onclick="next()">${nextTxt}</button>`:''}
  </div>`;
}

/* ---------- CALCULANDO ---------- */
function viewCalc(){
  return `<section class="card calc">
    <h2>Estoy armando tu diagnóstico</h2>
    <ul class="calc-list" id="calcList">
      ${SCORED_AREAS.map(a=>`<li>${esc(a.name)}</li>`).join('')}
      <li>Tu recomendación</li>
    </ul>
  </section>`;
}
function runCalc(){
  const items=[...document.querySelectorAll('#calcList li')];
  if(reduced()){ S.screen='result'; render(); return; }
  const stepMs=Math.round(2000/items.length);
  items.forEach((li,k)=>setTimeout(()=>li.classList.add('on'), k*stepMs));
  setTimeout(()=>{ S.screen='result'; render(); scrollTop(); say('Tu diagnóstico está listo.'); }, items.length*stepMs+350);
}

function fullBody(sc,prios,recs){
  const resto=SCORED_AREAS.filter(a=>!prios.includes(a.id)).map(a=>{const lv=nivel(sc[a.id]);
    return `<div class="other"><b>${esc(a.name)}</b>${esc(LECTURAS[a.id][lv].l)}</div>`;}).join('');
  const hist=S.answers.h2?HISTORIA[S.answers.h2]:'';
  const probo=label('h1'), quiere=label('h4');
  const url=reportUrl();
  return `<div class="report">
    <section class="sec">
      <h3>Tu negocio, área por área</h3>
      <p class="sub">Puntaje de 0 a 100 en cada área financiera.</p>
      ${secAreas(sc,0,7)}
    </section>
    <section class="sec">
      <h3>Tus 3 prioridades</h3>
      <p class="sub">Las áreas donde hoy se te va más plata, tiempo o tranquilidad.</p>
      <div class="prio">${secPrio(sc,prios)}</div>
    </section>
    <section class="sec">
      <h3>El resto de tu negocio</h3>
      <div class="others">${resto}</div>
    </section>
    ${hist?`<section class="sec historia">
      <h3>Sobre lo que ya probaste</h3>
      ${probo?`<p>Probaste: ${esc(probo.toLowerCase())}.</p>`:''}
      <p>${esc(hist)}</p>
      ${quiere?`<p>Y lo que querés lograr es claro: ${esc(quiere.toLowerCase())}. Ese es el norte de tus reglas.</p>`:''}
    </section>`:''}
    <section class="sec">
      <h3>Por dónde seguir</h3>
      <p class="sub">Tu plan de acción según tus respuestas, tu forma de aprender y el acompañamiento que buscás.</p>
      <div class="servs">${secServicios(recs,prios)}</div>
    </section>
    ${fromShared?'':`<div class="keep">
      <h4>Guardá tu informe</h4>
      <p>Este link abre tu diagnóstico completo cuando quieras, en cualquier teléfono.</p>
      <div class="keep-url" id="keepUrl">${esc(url)}</div>
      <button class="btn ghost" id="copyBtn" onclick="copyUrl()">Copiar el link</button>
    </div>`}
    <a class="social" href="${esc(CONFIG.INSTAGRAM)}" target="_blank" rel="noopener">
      <div><b>Seguime en Instagram</b><span>Comparto todas las semanas cómo ordenar los números de un negocio de servicios.</span></div>
    </a>
    <div class="btn-row"><button class="btn ghost full" onclick="askRestart()">Hacer el diagnóstico de nuevo</button></div>
  </div>`;
}

const PAISES=[['+598','UY'],['+54','AR'],['+56','CL'],['+57','CO'],['+52','MX'],['+51','PE'],['+595','PY'],['+593','EC'],['+591','BO'],['+58','VE'],['+506','CR'],['+507','PA'],['+1','US'],['+34','ES']];

/* =====================================================================
   NAVEGACIÓN
   ===================================================================== */
function go(i){
  S.i=i;
  const st=STEPS[i];
  S.screen = st.kind==='break' ? 'break' : 'q';
  render(); scrollTop();
  if(st.kind==='q') say('Pregunta '+(Q.indexOf(st.q)+1)+' de '+Q.length+'. '+st.q.q);
}
function start(){ go(0); }
function resume(){
  const i=STEPS.findIndex(s=>s.kind==='q' && !answered(s.q));
  if(i===-1){ S.screen='result'; render(); scrollTop(); } else go(i);
}
function askRestart(){
  const hechas=nAnswered();
  if(hechas>0 && !confirm('Vas a borrar '+hechas+' respuesta'+(hechas>1?'s':'')+' y empezar de cero. ¿Seguro?')) return;
  const lead=S.lead, done=S.leadDone;
  fromShared=false;
  S={screen:'q',i:0,answers:{},unlocked:false,lead,leadDone:done};
  history.replaceState(null,'',location.pathname+location.search);
  go(0);
}
function scrollTop(){ window.scrollTo({top:0,behavior:reduced()?'auto':'smooth'}); }

function onText(el){
  S.answers[el.dataset.qid]=el.value;
  const b=$('#nextBtn');
  if(b) b.textContent = el.value.trim() ? 'Continuar' : 'Saltar esta pregunta';
  store.set();
}

function pick(v){
  const q=STEPS[S.i].q;
  if(q.type==='multi'){
    let arr=[...(S.answers[q.id]||[])];
    if(arr.includes(v)) arr=arr.filter(x=>x!==v);
    else {
      if(v==='nada') arr=['nada'];
      else { arr=arr.filter(x=>x!=='nada'); if(q.max&&arr.length>=q.max) arr.shift(); arr.push(v); }
    }
    S.answers[q.id]=arr; render();
  } else {
    S.answers[q.id]=v; render();
    setTimeout(next,320);
  }
}
function next(){
  const st=STEPS[S.i];
  if(st.kind==='q' && st.q.type==='text' && S.answers[st.q.id]===undefined) S.answers[st.q.id]='';
  if(S.i<STEPS.length-1){ go(S.i+1); }
  else {
    if(S.leadDone && S.lead){ S.unlocked=true; }
    S.screen='calc'; render(); scrollTop(); runCalc();
  }
}
function back(){
  if(S.i===0){ S.screen='intro'; render(); scrollTop(); }
  else go(S.i-1);
}

/* teclado */
document.addEventListener('keydown',e=>{
  if(S.screen!=='q') return;
  const tag=document.activeElement.tagName;
  if(/INPUT|TEXTAREA|SELECT/.test(tag)) return;
  const q=STEPS[S.i].q, n=parseInt(e.key,10);
  if(q.opts && n>=1 && n<=q.opts.length){ e.preventDefault(); pick(q.opts[n-1].v); return; }
  if(e.key==='Enter' && q.type==='multi' && (S.answers[q.id]||[]).length){ e.preventDefault(); next(); return; }
  if(q.opts && (e.key==='ArrowDown'||e.key==='ArrowUp')){
    e.preventDefault();
    const els=[...document.querySelectorAll('.opt')];
    const cur=els.indexOf(document.activeElement);
    const nx=e.key==='ArrowDown' ? (cur+1)%els.length : (cur<=0?els.length-1:cur-1);
    els[nx]?.focus();
  }
});

/* =====================================================================
   LEAD + ENVÍO A GOHIGHLEVEL
   ===================================================================== */
function encodeAnswers(){
  const a={...S.answers}; delete a.h3; // el texto libre no viaja en el link
  return btoa(unescape(encodeURIComponent(JSON.stringify(a))));
}
function reportUrl(){
  const base = CONFIG.PUBLIC_URL || (location.origin+location.pathname);
  return base.split('#')[0]+'#r='+encodeAnswers();
}
async function copyUrl(){
  const b=$('#copyBtn');
  try{ await navigator.clipboard.writeText(reportUrl()); b.textContent='¡Copiado!'; }
  catch(e){
    const r=document.createRange(); r.selectNodeContents($('#keepUrl'));
    const s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent='Copialo desde arriba';
  }
  setTimeout(()=>{ if(b) b.textContent='Copiar el link'; },2500);
}

function informeTexto(r){
  const P=PERFILES[r.pf], lines=[];
  lines.push('PERFIL: '+P.nombre, P.frase, '', 'PUNTAJE GENERAL: '+r.sc.global+'/100', scoreFrame(r.sc.global), '');
  lines.push('ÁREA POR ÁREA');
  SCORED_AREAS.forEach(a=>lines.push('- '+a.name+': '+r.sc[a.id]+'/100 ('+nivelTxt[nivel(r.sc[a.id])]+')'));
  lines.push('', 'TUS 3 PRIORIDADES');
  r.prios.forEach((id,k)=>{const L=LECTURAS[id][nivel(r.sc[id])];
    lines.push((k+1)+'. '+AREAS.find(a=>a.id===id).name, L.l, 'Esta semana: '+L.a, '');});
  lines.push('POR DÓNDE SEGUIR');
  r.recs.forEach((id,k)=>lines.push((k===0?'Recomendado: ':'Opción: ')+SERVICIOS[id].nombre+' → '+linkServ(id)));
  return lines.join('\n');
}

function utm(){
  const p=new URLSearchParams(location.search), o={};
  ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'].forEach(k=>o[k]=p.get(k)||'');
  return o;
}

async function sendLead(payload){
  if(!CONFIG.GHL_WEBHOOK_URL){ console.warn('Radar CFO: falta GHL_WEBHOOK_URL en CONFIG. Datos del lead:',payload); return false; }
  const body=JSON.stringify(payload);
  try{
    await fetch(CONFIG.GHL_WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body});
    return true;
  }catch(e){
    // Si el navegador bloquea la respuesta (CORS), reintenta en modo simple
    try{ await fetch(CONFIG.GHL_WEBHOOK_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body}); return true; }
    catch(e2){ console.error('Radar CFO: no se pudo enviar el lead',e2); return false; }
  }
}

async function unlock(ev){
  ev.preventDefault();
  const g=id=>$('#'+id).value.trim();
  const err=$('#formErr'); err.textContent='';
  document.querySelectorAll('.fld.err').forEach(f=>f.classList.remove('err'));
  const bad=[];
  if(!g('fn')) bad.push('fn');
  if(!g('ln')) bad.push('ln');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(g('em'))) bad.push('em');
  const digits=g('ph').replace(/\D/g,'').replace(/^0+/,'');
  if(digits.length<6) bad.push('ph');
  if(bad.length){
    bad.forEach(id=>$('#'+id).closest('.fld').classList.add('err'));
    err.textContent='Revisá los campos marcados.';
    const el=$('#'+bad[0]); el.focus(); el.scrollIntoView({block:'center',behavior:reduced()?'auto':'smooth'});
    return;
  }
  if(!$('#ok').checked){ err.textContent='Marcá la casilla para que pueda mandarte el informe.'; $('#ok').focus(); return; }

  const btn=$('#unlockBtn'); btn.disabled=true; btn.textContent='Preparando tu informe...';
  const r=buildResult(), P=PERFILES[r.pf], cc=$('#cc').value;
  S.lead={first_name:g('fn'),last_name:g('ln'),email:g('em'),country_code:cc,phone_local:digits,business_name:g('bn'),instagram:g('ig')};

  const payload={
    first_name:S.lead.first_name, last_name:S.lead.last_name,
    full_name:S.lead.first_name+' '+S.lead.last_name,
    email:S.lead.email, phone:cc+digits, country_code:cc,
    company_name:S.lead.business_name, instagram:S.lead.instagram,
    consentimiento:'si', source:'Radar CFO',
    tags:['radar-cfo','perfil-'+r.pf,'rec-'+r.recs[0],'aprende-'+(S.answers.f2||''),'alcance-'+(S.answers.f6||''),'urgencia-'+(S.answers.f3||'')].join(','),
    rc_fecha:new Date().toISOString(),
    rc_perfil:P.nombre, rc_perfil_id:r.pf, rc_diagnostico_frase:P.frase,
    rc_puntaje_global:r.sc.global,
    rc_puntaje_claridad:r.sc.claridad, rc_puntaje_precios:r.sc.precios, rc_puntaje_caja:r.sc.caja,
    rc_puntaje_orden:r.sc.orden, rc_puntaje_sueldo:r.sc.sueldo, rc_puntaje_modelo:r.sc.modelo, rc_puntaje_direccion:r.sc.direccion,
    rc_prioridad_1:AREAS.find(a=>a.id===r.prios[0]).name,
    rc_prioridad_2:AREAS.find(a=>a.id===r.prios[1]).name,
    rc_prioridad_3:AREAS.find(a=>a.id===r.prios[2]).name,
    rc_servicio_recomendado:SERVICIOS[r.recs[0]].nombre, rc_servicio_recomendado_id:r.recs[0],
    rc_servicio_recomendado_url:linkServ(r.recs[0]),
    rc_servicio_opcion_2:SERVICIOS[r.recs[1]].nombre, rc_servicio_opcion_3:SERVICIOS[r.recs[2]].nombre,
    rc_forma_aprender:label('f2'), rc_alcance:label('f6'), rc_busca:label('f1'), rc_urgencia:label('f3'), rc_tiempo:label('f4'), rc_inversion:label('f5'),
    rc_facturacion:label('m4'), rc_clientes:label('m5'), rc_como_vende:label('m1'),
    rc_antiguedad:label('d4'), rc_equipo:label('d5'),
    rc_probo:label('h1'), rc_por_que_no_funciono:label('h2'), rc_en_sus_palabras:label('h3'), rc_quiere_lograr:label('h4'),
    rc_respuestas:Q.map(q=>q.q+' → '+(label(q.id)||'(sin respuesta)')).join('\n'),
    rc_informe_texto:informeTexto(r),
    rc_informe_url:reportUrl(),
    ...utm(),
    referrer:document.referrer||'', landing_url:location.href.split('#')[0]
  };
  mailSent = await sendLead(payload);
  S.unlocked=true; S.leadDone=true; render(); scrollTop();
  say('Informe desbloqueado.');
}

/* =====================================================================
   INICIO
   ===================================================================== */
(function init(){
  const m=location.hash.match(/^#r=(.+)$/);
  if(m){
    try{
      S={screen:'result',i:0,answers:JSON.parse(decodeURIComponent(escape(atob(m[1])))),unlocked:true,lead:null,leadDone:false};
      fromShared=true; render(); return;
    }catch(e){}
  }
  const saved=store.get();
  if(saved && saved.answers){ S={...S,...saved}; if(S.screen!=='result') S.screen='intro'; }
  render();
})();
</script>
